modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

authors="${mod_authors}"

description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Argos Weaponry installs its bundled content packs from the mod constructor.
# It has to be constructed before the mods below, because Vic's Point Blank
# scans the pointblank folder for content packs while it is constructed.
[[dependencies.${mod_id}]]
    modId="pointblank"
    mandatory=true
    versionRange="[2.2.0,)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="[4.8.4,5)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="pointblankextra"
    mandatory=true
    versionRange="[1.1,)"
    ordering="BEFORE"
    side="BOTH"

[modproperties."catalogue"]
catalogueImageIcon="icon.png"
#catalogueBackground="catalogue_background.png"
configuredBackground="minecraft:textures/block/stone.png"
